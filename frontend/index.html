<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#11100e" />
    <meta
      name="description"
      content="Find and join pickup basketball runs at real courts around Montreal. Browse the map and see who is playing, no account needed."
    />

    <!-- Open Graph, so the link previews properly when it is shared -->
    <meta property="og:title" content="Pickup Hoops — Montreal" />
    <meta
      property="og:description"
      content="See who is playing at courts around Montreal tonight."
    />
    <meta property="og:type" content="website" />

    <!-- One variable typeface across the whole app. Bricolage Grotesque has an
         optical size axis and enough character in its heavy weights to carry
         the headings without a second family. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap"
      rel="stylesheet"
    />

    <title>Pickup Hoops — Montreal</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
